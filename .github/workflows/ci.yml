name: Simple Ci Pipeline

on:
   push:
     branches: [ "main" ]
   pull_request:
     branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run a simple command
        run: echo "This is my Pipeline for YAML"

      - name: first steps
        run: echo "to learn steps"

      - name: second steps
        run: echo "second step"
      
      - name: breaking step
        run: echo "pipeline is fixed"

      - name: Login to GHCR
        run: echo "${{secrets.GHCR_TOKEN}}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build a Docker image
        run: docker build -t ghcr.io/${{ github.actor }}/mydoc:v1 .

      - name: Push a docker image
        run: docker push ghcr.io/${{ github.actor }}/mydoc:v1


  

